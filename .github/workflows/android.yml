name: Build Ziyana TV and Mobile APKs

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build TV and Mobile APKs
        run: gradle --no-daemon assembleTvDebug assembleMobileDebug
      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Ziyana-TV-APK
          path: app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error
      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: Ziyana-Mobile-APK
          path: app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
          if-no-files-found: error
